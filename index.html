


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frontend Mentor || QR Code Component</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body class="min-vh-100 d-flex flex-column qr-page">

    <!-- Main content -->
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center">

        <!-- Bootstrap grid row and column -->
<div class="row justify-content-center w-100">
<div class="col-12 d-flex justify-content-center">

    <!-- Bootstrap card -->
    <div class="card qr-card border-0 rounded-4 shadow-sm p-3">

                    <!-- QR Code image -->
                    <img
                        src="./images/image-qr-code.png"
                        class="img-fluid rounded-3"
                        alt="QR code linking to Frontend Mentor"
                    >

                    <!-- Card content -->
                    <div class="card-body text-center px-0 pb-0">

                        <h1 class="card-title fw-bold fs-4 mb-3">
                            Improve your front-end skills by building projects
                        </h1>

                        <p class="card-text text-secondary mb-2">
                            Scan the QR code to visit RTT Frontend Mentor and take your coding skills to the next level
                       </p>

            </div>
              </div>
                </div>
        </div>
            </main>

    <!-- Attribution -->
    <footer class="text-center small py-3">
        Challenge by
        <a href="https://www.frontendmentor.io/" target="_blank" rel="noopener noreferrer">
           RTT-Frontend Mentor
        </a>.
        Coded by <a href="#">|| Obiora M ||</a>.
</footer>

</body>
    </html>
